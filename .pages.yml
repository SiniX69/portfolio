media:
  - name: images
    label: Images & captures
    input: media/images
    output: /media/images
    rename: safe
    categories: [image]
  - name: documents
    label: Documents & PDF
    input: media/documents
    output: /media/documents
    rename: safe
    categories: [document]

components:
  seo:
    type: object
    label: SEO
    fields:
      - name: title
        type: string
      - name: description
        type: text

content:
  - name: profile
    label: Profil
    type: file
    path: data/profile.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: Nom complet
        type: string
      - name: firstName
        label: Prénom
        type: string
      - name: lastName
        label: Nom
        type: string
      - name: title
        label: Titre
        type: string
      - name: shortIntro
        label: Introduction
        type: text
      - name: about
        label: Présentation
        type: rich-text
      - name: education
        label: Formation
        type: string
      - name: location
        label: Localisation
        type: string
      - name: goal
        label: Objectif
        type: string
      - name: availability
        label: Disponibilité
        type: string
      - name: github
        label: GitHub
        type: string
      - name: linkedin
        label: LinkedIn
        type: string
      - name: email
        label: Email
        type: string
      - name: cv
        label: CV
        type: file
        options:
          media: documents
          path: cv
          extensions: [pdf]
      - name: contactText
        label: Texte de contact
        type: text

  - name: projects
    label: Projets
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: period
        label: Période
        type: string
      - name: type
        label: Type
        type: string
      - name: categories
        label: Catégories
        type: string
        list: true
      - name: summary
        label: Résumé
        type: text
      - name: technologies
        label: Technologies
        type: string
        list: true
      - name: competencies
        label: Compétences BTS
        type: string
        list: true
      - name: document
        label: Preuve principale
        type: file
        options:
          media: documents
          categories: [document]

  - name: experiences
    label: Expériences
    type: file
    path: data/experiences.json
    format: json
    list: true
    fields:
      - name: period
        label: Période
        type: string
      - name: title
        label: Intitulé
        type: string
      - name: organization
        label: Organisation
        type: string
      - name: description
        label: Description
        type: text
      - name: tags
        label: Tags
        type: string
        list: true

  - name: certifications
    label: Certifications
    type: file
    path: data/certifications.json
    format: json
    list: true
    fields:
      - name: name
        label: Nom
        type: string
      - name: status
        label: Statut
        type: string
      - name: description
        label: Description
        type: text
      - name: document
        label: Preuve
        type: file
        options:
          media: documents
          categories: [document]

  - name: competencies
    label: Compétences BTS SIO
    type: file
    path: data/competencies.json
    format: json
    list: true
    fields:
      - name: number
        label: Numéro
        type: number
      - name: title
        label: Domaine
        type: string
      - name: description
        label: Description
        type: text
      - name: evidence
        label: Réalisations / preuves
        type: string
        list: true

  - name: skills
    label: Compétences techniques
    type: file
    path: data/skills.json
    format: json
    list: true
    fields:
      - name: icon
        label: Icône
        type: string
      - name: name
        label: Catégorie
        type: string
      - name: description
        label: Description
        type: text
      - name: items
        label: Technologies
        type: string
        list: true

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} -> {newPath}"
